name: Production release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/checks.yml
    with:
      version: ${{ github.event.release.tag_name }}

  deploy:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://sid64.quest
    permissions:
      contents: write # Attach the tested package to this release.
    env:
      VERSION: ${{ github.event.release.tag_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-arm64
          path: release
      - name: Verify artifact and preserve release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -c rck-linux-arm64.tar.gz.sha256
          # Existing assets must match; never overwrite an immutable release.
          mkdir existing
          if gh release download "$VERSION" -p rck-linux-arm64.tar.gz.sha256 -D existing; then
            cmp rck-linux-arm64.tar.gz.sha256 existing/rck-linux-arm64.tar.gz.sha256
          else
            gh release upload "$VERSION" rck-linux-arm64.tar.gz rck-linux-arm64.tar.gz.sha256
          fi
      - name: Wait for modeburner's outbound release agent
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          deadline = time.monotonic() + 1800
          while time.monotonic() < deadline:
              with urllib.request.urlopen('https://sid64.quest/deployment-status.json', timeout=20) as response:
                  state = json.load(response)
              if state.get('version') == os.environ['VERSION']:
                  if state.get('commit') != os.environ['GITHUB_SHA']:
                      raise SystemExit('Deployment commit does not match release')
                  if state.get('status') == 'failed':
                      raise SystemExit('Production deployment failed; inspect the host release record')
                  if state.get('status') == 'complete':
                      print('Modeburner confirmed successful deployment')
                      break
              time.sleep(15)
          else:
              raise SystemExit('Timed out waiting for production deployment')
          PY
      - name: Check public endpoints
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 https://sid64.quest/ready >/dev/null
          curl --fail --silent --show-error --retry 3 --max-time 20 https://sid64.quest/login >/dev/null
          printf 'Deployed **%s** from %s to https://sid64.quest\n' "$VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
