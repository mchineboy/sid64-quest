services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rck-postgres
    environment:
      POSTGRES_DB: race_condition_kingdom
      POSTGRES_USER: mud_user
      POSTGRES_PASSWORD: mud_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - rck-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mud_user -d race_condition_kingdom"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rck-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rck-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # MongoDB for Logs
  mongodb:
    image: mongo:7
    container_name: rck-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: race_condition_kingdom_logs
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - rck-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  rck-network:
    driver: bridge
