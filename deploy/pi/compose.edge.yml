# Opt-in replacement for compose.yml; see docs/BLUE-GREEN-DEPLOYMENTS.md.
name: rck
x-core: &core
  restart: unless-stopped
  env_file: .env
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  command: [/app/game-core]
  environment:
    CORE_LISTEN: 0.0.0.0:8082
    CORE_TOKEN: ${CORE_TOKEN:?required}
  volumes: [./edge-control:/control]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  healthcheck:
    test: [CMD-SHELL, 'wget -q --header="Authorization: Bearer $$CORE_TOKEN" -O /dev/null http://127.0.0.1:8082/ready']
    interval: 5s
    timeout: 3s
    retries: 10
  stop_grace_period: 20s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    extends: {file: compose.yml, service: postgres}
  redis:
    extends: {file: compose.yml, service: redis}
  auth:
    extends: {file: compose.yml, service: auth}
    image: ${AUTH_IMAGE:-rck:alpha}
  core-blue:
    <<: *core
    image: ${CORE_BLUE_IMAGE:?pin the blue release image}
  core-green:
    <<: *core
    image: ${CORE_GREEN_IMAGE:?pin the green release image}
  edge:
    image: ${EDGE_IMAGE:?pin the socket edge image separately from the core}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [/app/terminal-edge]
    environment:
      HOST: 0.0.0.0
      CORE_TOKEN: ${CORE_TOKEN:?required}
      CORE_TARGET_FILE: /control/target
      IDLE_TIMEOUT: 900
      MAX_CONNECTIONS: 1000
    volumes: [./edge-control:/control:ro]
    ports: ["${MUD_BIND_IP:?required}:2323:2323", "${MUD_BIND_IP:?required}:6464:6464"]
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 2323 && nc -z 127.0.0.1 6464"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  postgres_data:
  redis_data:
