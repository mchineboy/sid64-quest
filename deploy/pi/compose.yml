name: rck
x-app: &app
  image: rck:alpha
  restart: unless-stopped
  env_file: .env
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: race_condition_kingdom
      POSTGRES_USER: mud_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mud_user -d race_condition_kingdom"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
  auth:
    <<: *app
    command: [/app/auth-service]
    ports: ["127.0.0.1:8081:8080"]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    <<: *app
    command: [/app/telnet-gateway]
    ports: ["${MUD_BIND_IP:?required}:2323:2323", "${MUD_BIND_IP:?required}:6464:6464"]
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 2323 && nc -z 127.0.0.1 6464"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
volumes:
  postgres_data:
  redis_data:
