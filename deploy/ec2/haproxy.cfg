global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    maxconn 128

defaults
    log global
    mode tcp
    option tcplog
    # Keep both independent TCP legs alive through idle NAT/firewall mappings.
    # Transport probes do not add ANSI/PETSCII bytes or reset application idle time.
    option clitcpka
    option srvtcpka
    clitcpka-idle 30s
    clitcpka-intvl 10s
    clitcpka-cnt 9
    srvtcpka-idle 30s
    srvtcpka-intvl 10s
    srvtcpka-cnt 9
    timeout connect 10s
    timeout client 16m
    timeout server 16m

frontend mud_ansi
    bind 0.0.0.0:2323
    default_backend pi_ansi

backend pi_ansi
    server pi 100.67.213.90:2323 check inter 30s

frontend mud_petscii
    bind 0.0.0.0:6464
    default_backend pi_petscii

backend pi_petscii
    server pi 100.67.213.90:6464 check inter 30s
